<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARLOUR</title>

<style>

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f3f4f6;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px 0;
}

.container{
  width:90%;
  max-width:420px;
  background:#fff;
  padding:22px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  text-align:center;
}

.header-img{
  display:block;
  width:auto;
  max-width:100%;
  height:auto;
  max-height:200px;
  margin:0 auto;
  border-radius:10px;
  object-fit:contain;
}

.message-box{
  background:rgba(255,255,255,0.5);
  padding:5px;
  border-radius:10px;
  font-size:16px;
  margin-bottom:0px;
  text-align:left;
}

.message-box a{
  color:#2563eb;
  text-decoration:none;
  display:inline-block;
  margin-bottom:4px;
}

.message-box a:hover{
  text-decoration:underline;
}

.instagram-link{
  margin:4px 0 0 0;
  font-size:14px;
  text-align:left;
}

.instagram-link a{
  color:#E4405F;
  text-decoration:none;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

label{
  font-size:14px;
  color:#555;
  display:block;
  text-align:left;
}

input{
  width:100%;
  padding:14px;
  margin-top:6px;
  margin-bottom:18px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:600;
}

button:active{
  transform:scale(0.98);
}

</style>
</head>

<body>

<div class="container">
<img class="header-img" src="logo_parlour.png">
<div class="message-box">
  <div id="message"></div>
</div>
<label>Phone number</label>
<input type="tel" id="phone" placeholder="Enter phone number">

<button onclick="sendSMS()">Send SMS</button>

</div>

<script>

function getParam(name){
  const url = new URLSearchParams(window.location.search)
  return url.get(name)
}

const name = getParam("name") || "Stephanie"

const message =
`
I absolutely adore my hairstylist ${name} at Parlour at the Point and couldn’t keep her to myself 🤍 Between the incredible product lines they carry — Oribe, Davines, Mr. Smith and more — and the beautiful work coming out of the salon, it’s truly a special place.

${name}’s work is exceptional, and she’s graciously shared a special gift for a select few. When you book your first appointment, you’ll receive $25 off your service and $25 off a product. Simply include NEW25 in the notes when booking or mention it at your visit ✨

While I personally see ${name}, you truly can’t go wrong — you’re welcome to book with any stylist in the salon and receive the same incredible care and beautiful results.

You can book through the salon website or give them a call to schedule your visit!
🌐 www.parlouratthepoint.com
📞 (831) 316-0845
📸 Check out our Instagram @parlouratthepointsalon
https://www.instagram.com/parlouratthepointsalon/`

const displayMessage = message
  .replace(/\$25 off/g, '<strong>$25 off</strong>')
  .replace(/🌐 www\.parlouratthepoint\.com/g, '<a href="https://www.parlouratthepoint.com" target="_blank" rel="noopener noreferrer">🌐 www.parlouratthepoint.com</a>')
  .replace(/📞 \(831\) 316-0845/g, '<a href="tel:8313160845">📞 (831) 316-0845</a>')
  .replace(/📸 Check out our Instagram @parlouratthepointsalon\nhttps:\/\/www\.instagram\.com\/parlouratthepointsalon\//, '<p class="instagram-link"><a href="https://www.instagram.com/parlouratthepointsalon/" target="_blank" rel="noopener noreferrer">📸 Check out our Instagram @parlouratthepointsalon</a></p>')
  .replace(/\n/g, '<br>')

document.getElementById("message").innerHTML = displayMessage

function sendSMS(){

  let phone = document.getElementById("phone").value.trim()

  if(!phone){
    alert("Please enter a phone number")
    return
  }

  const encoded = encodeURIComponent(message)

  window.location.href = `sms:${phone}?body=${encoded}`
}

</script>

</body>
</html>
